minimum_pre_commit_version: "4.6.2"

repos:
  - repo: local
    hooks:
      - id: ruff-format-check
        name: Ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-lint
        name: Ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      # 与 CI 的 notebooks job 对齐：本地提交前也跑 notebook 冒烟检查
      - id: check-notebooks
        name: Notebook smoke check
        entry: uv run python scripts/check_notebooks.py
        language: system
        pass_filenames: false
        always_run: true
