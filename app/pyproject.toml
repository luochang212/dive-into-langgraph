[project]
name = "gradio-agent-app"
version = "0.1.0"
description = "基于 LangChain 构建流式对话智能体"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.0.3",
    "gradio>=6.26.0",
    "langchain[mcp]>=1.4.0",
    "langchain-openai>=1.6.1",
    "langgraph>=1.2.11",
    "openai>=3.8.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "typer>=0.27.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.uv]

[[tool.uv.index]]
url = "https://mirrors.cloud.tencent.com/pypi/simple/"
default = true
